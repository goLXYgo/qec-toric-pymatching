[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toric-gen"
version = "0.1.0"
description = "Stim and PyMatching compatible toric code memory experiment generators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "stim",
    "pymatching",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]